<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Journal du soir</title>
    <link rel="stylesheet" href="../css/variables.css" />

    <link rel="stylesheet" href="../css/journal-du-soir.css" />

    <script src="../js/journal-du-soir.js" defer></script>
  </head>

  <body>
    <a href="/html/menu.html" class="menu-btn">menu</a>

    <!-- Bulles flottantes -->
    <div class="floating-bubbles">
      <span class="fbubble"></span>
      <span class="fbubble"></span>
      <span class="fbubble"></span>
      <span class="fbubble"></span>
      <span class="fbubble"></span>
    </div>

    <!-- Bulles décoratives -->
    <div class="static-bubbles">
      <div class="bubble b1"></div>
      <div class="bubble b2"></div>
      <div class="bubble b3"></div>
    </div>
    <main class="journal-container">
      <h1 class="titre">écrire ta journée…</h1>

      <p class="texte">prends un moment pour déposer ce que tu ressens</p>

      <textarea
        class="journal-textarea"
        placeholder="écris ici, sans filtre…"
      ></textarea>

      <div class="buttons-container">
        <button class="btn-zen btn-envoyer">envoyer ma bulle</button>
        <button
          class="btn-zen btn-voir"
          onclick="window.location.href='mes-bulles.html'"
        >
          voir mes bulles
        </button>
      </div>
    </main>
  </body>
</html>
